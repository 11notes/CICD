name: register dependencies

on:
  workflow_dispatch:
    inputs:
      dependencies:
        description: 'dependencies to set (JSON encoded)'
        type: string
        required: true

      repository:
        description: 'name of repository'
        type: string
        required: true

env:
  JSON_FILE: ./images/dependencies.json

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: write

    steps:
      - name: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: 'master'

      - name: update dependencies.json
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const { readFileSync, writeFileSync } = require('node:fs');
            const { resolve } = require("node:path");
            const { inspect } = require('node:util');
            const { Buffer } = require('node:buffer');

            (async()=>{
              try{
                const dependencies = JSON.parse(Buffer.from('${{ github.event.inputs.dependencies }}'.toLowerCase(), 'base64').toString('ascii'));
                const repository = '${{ github.event.inputs.repository }}'.toLowerCase();
                const file = '${{ env.JSON_FILE }}';
                const path = resolve(file);
                const json = JSON.parse(readFileSync(path).toString());

                // print
                  core.info(inspect({dependencies:dependencies, repository:repository, json:json}, {showHidden:false, depth:null, colors:true}));

                for(const dependency of dependencies){
                  if(!Array.isArray(json[dependency])){
                    core.warning(`dependency ${dependency} not yet present, adding ...`);
                    json[dependency] = [];
                  }
                  if(!json[dependency].includes(repository)){
                    json[dependency].push(repository);
                    core.info(`added ${repository} to dependency ${dependency}`);
                    writeFileSync(path, JSON.stringify(json, null, 2));
                  }
                }
              }catch(e){
                core.warning(e);
              }
            })();

      - name: checkout
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ${{ env.JSON_FILE }}
          git commit -m "chore: update dependecies with ${{ github.event.inputs.repository }}"
          git push origin HEAD:master